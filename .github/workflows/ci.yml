name: Windows CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install dependencies
        run: npm.cmd ci
      - name: Build and type-check
        run: npm.cmd run build
      - name: Backend tests and test type-check
        run: npm.cmd run test:unit
      - name: Stage safety tests
        run: node --test scripts/tests/stage-safety.test.mjs
      - name: Install Chromium
        run: npm.cmd run install:browsers --workspace e2e
      - name: Verify Demo 1 on synthetic Stage
        run: ./scripts/verify-ci-stage.ps1
      - name: Upload Stage diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage-demo-one
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ci-stage-logs/
            e2e/playwright-report/
            e2e/test-results/
